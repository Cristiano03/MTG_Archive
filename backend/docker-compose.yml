services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mtg, POSTGRES_PASSWORD: ${DB_PASSWORD:?imposta DB_PASSWORD}, POSTGRES_DB: mtg }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]   # mai esposto pubblicamente
    restart: unless-stopped
volumes: { pgdata: {} }
